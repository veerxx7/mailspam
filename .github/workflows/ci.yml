name: ML CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Verify files
      run: dir

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pandas numpy scikit-learn joblib

    - name: Run Training
      run: python src/train_backend.py
